spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
  jackson2:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  data:
    redis:
      cluster:
        nodes: []
      host: ${REDIS_TEST_HOST:127.0.0.1}
      port: ${REDIS_TEST_PORT:6379}
      username: ${REDIS_TEST_USERNAME:}
      password: ${REDIS_TEST_PASSWORD:}
      ssl:
        enabled: false
  sql:
    init:
      mode: never

dubbo:
  provider:
    export: false

egon:
  cola:
    component:
      cache:
        enabled: false
        node-id: ""
        key-prefix: egon:cola:cache:v2:${spring.application.name}
        tenant-mdc-key: tenantId
        second-evict-delay: PT5S
        redis:
          topic: "egon:cola:cache:event"
        l1:
          max-size: 10000
        ttl:
          l1-expire: PT5M
          l1-jitter: PT2M
          l2-expire: PT1H
          l2-jitter: PT20M
          null-expire: PT60S
        batch:
          max-keys: 1000
        lock:
          wait-time: PT0.5S
          lease-time: PT10S
      mybatis-plus:
        enabled: true
        tenant-id:
          mdc-key: tenantId
          ignored-tables: []
        audit:
          user-id-mdc-key: userId
        pagination:
          enabled: true
          max-page-size: 500
          overflow: false
        batch:
          default-size: 1000
          max-chunk-size: 1000
          max-collection-size: 10000
        block-attack:
          enabled: true
        optimistic-locker:
          enabled: true
        dynamic-table-name:
          enabled: false
          tables: {}
        illegal-sql:
          enabled: false
        ddl:
          enabled: true
          lock-timeout: PT30S
          statement-timeout: PT300S
          topology-ready-timeout: PT60S
        local-write-guard:
          enabled: true
          allowed-root-statements: {}
        sharding:
          enabled: true
          mode: SHARDING
          config-style: STRATEGY
          transaction-default-type: LOCAL
          data-sources:
            - name: master_data
              logical-name: master_data
              role: PRIMARY
              driver-class-name: org.postgresql.Driver
              jdbc-url: jdbc:postgresql://localhost:5432/evaluation_open_test_master_data
              username: test
              password: test
            - name: shard_0
              logical-name: shard_0
              role: PRIMARY
              driver-class-name: org.postgresql.Driver
              jdbc-url: jdbc:postgresql://localhost:5432/evaluation_open_test_shard_0
              username: test
              password: test
            - name: shard_1
              logical-name: shard_1
              role: PRIMARY
              driver-class-name: org.postgresql.Driver
              jdbc-url: jdbc:postgresql://localhost:5432/evaluation_open_test_shard_1
              username: test
              password: test
          tables:
            evaluation_course:
              type: SINGLE
              data-source: master_data
            evaluation_course_schedule:
              type: STANDARD_TENANT_ID
              sharding-column: tenant_id
            evaluation_exam:
              type: STANDARD_TENANT_ID
              sharding-column: tenant_id
            evaluation_exam_paper:
              type: STANDARD_TENANT_ID
              sharding-column: tenant_id
            evaluation_score:
              type: STANDARD_TENANT_ID
              sharding-column: tenant_id
      id:
        enabled: true
        machine-id: 0
        max-clock-backward: PT0.005S
        redis:
          enabled: false
          env: test
          app: fixture
          lease-duration: 5m
          renew-interval: 1m
      dtp:
        enabled: false
        report:
          enabled: false

management:
  health:
    rabbit:
      enabled: false
    redis:
      enabled: false

app:
  integrations:
    organization:
      triple-target: tri://127.0.0.1:50051
      enabled: false
    rabbitmq:
      enabled: false
      listener-auto-startup: false

logging:
  level:
