# Release input example. The deployment assembler supplies the approved namespace,
# immutable image digest and input revisions before applying these objects.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stellar-enclosure-source-web-open
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stellar-enclosure-source-web-open-stable
  labels:
    app.kubernetes.io/name: stellar-enclosure-source-web-open
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: stellar-enclosure-source-web-open
      release: stable
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stellar-enclosure-source-web-open
        release: stable
        stellar.io/management-port: "9090"
        stellar.io/network-access: gamma
    spec:
      serviceAccountName: stellar-enclosure-source-web-open
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: application
          image: registry.example.invalid/stellar-enclosure-source-web-open:replace-me
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - {name: http, containerPort: 8080}
            - {name: management, containerPort: 9090}
            - {name: triple, containerPort: 50051}
          envFrom:
            - configMapRef:
                name: stellar-enclosure-source-web-open-settings-v1
            - secretRef:
                name: stellar-enclosure-source-web-open-credentials-v1
          env:
            - {name: SPRING_PROFILES_ACTIVE, value: prod}
            - {name: SERVER_PORT, value: "8080"}
            - {name: SERVER_SHUTDOWN, value: graceful}
            - {name: SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE, value: 30s}
            - {name: MANAGEMENT_SERVER_PORT, value: "9090"}
            - {name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED, value: "true"}
            - {name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE, value: health}
            - {name: SPRING_CONFIG_ADDITIONAL_LOCATION, value: 'file:/etc/stellar/runtime/application.yml'}
            - {name: DUBBO_PORT, value: "50051"}
            - name: POD_NAME
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
            - name: POD_UID
              valueFrom:
                fieldRef: {fieldPath: metadata.uid}
            - name: POD_IP
              valueFrom:
                fieldRef: {fieldPath: status.podIP}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 15
            timeoutSeconds: 2
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: temporary, mountPath: /tmp}
            - {name: logs, mountPath: /app/logs}
            - {name: startup-config, mountPath: /etc/stellar/runtime, readOnly: true}
            - {name: startup-secrets, mountPath: /run/secrets, readOnly: true}
      volumes:
        - name: temporary
          emptyDir: {sizeLimit: 128Mi}
        - name: logs
          emptyDir: {sizeLimit: 128Mi}
        - name: startup-config
          configMap:
            name: stellar-enclosure-source-web-open-boot-v1
            items:
              - {key: application.yml, path: application.yml}
        - name: startup-secrets
          secret:
            secretName: stellar-enclosure-source-web-open-credentials-v1
---
apiVersion: v1
kind: Service
metadata:
  name: stellar-enclosure-source-web-open-http
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: stellar-enclosure-source-web-open
    release: stable
  ports:
    - {name: http, port: 8080, targetPort: http, appProtocol: http}
---
apiVersion: v1
kind: Service
metadata:
  name: stellar-enclosure-source-web-open-triple
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: stellar-enclosure-source-web-open
  ports:
    - name: triple
      port: 50051
      targetPort: 19099
      appProtocol: kubernetes.io/h2c
---
apiVersion: v1
kind: Service
metadata:
  name: stellar-enclosure-source-web-open-triple-stable
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: stellar-enclosure-source-web-open
    release: stable
  ports:
    - name: triple
      port: 50051
      targetPort: triple
      appProtocol: kubernetes.io/h2c
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: stellar-enclosure-source-web-open-triple
spec:
  parentRefs:
    - group: ""
      kind: Service
      name: stellar-enclosure-source-web-open-triple
      port: 50051
  rules:
    - matches:
        - method: {service: egon.organization.v1.GradeService, method: CreateGrade}
        - method: {service: egon.organization.v1.GradeService, method: GetGrade}
        - method: {service: egon.organization.v1.SchoolClassService, method: CreateSchoolClass}
        - method: {service: egon.organization.v1.SchoolClassService, method: GetSchoolClass}
        - method: {service: egon.organization.v1.SchoolClassService, method: AssignUser}
        - method: {service: egon.organization.v1.UserService, method: CreateUser}
        - method: {service: egon.organization.v1.UserService, method: GetUser}
        - method: {service: egon.organization.v1.RoleService, method: AssignRole}
        - method: {service: egon.organization.v1.PermissionService, method: GrantPermission}
        - method: {service: egon.organization.v1.PermissionService, method: GetPermissionTree}
      backendRefs:
        - {name: stellar-enclosure-source-web-open-triple-stable, port: 50051, weight: 100}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: stellar-enclosure-source-web-open-triple-fallback
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: stellar-enclosure-source-web-open
      stellar.io/network-access: gamma
  ingressDeny:
    - fromEntities: [all]
      toPorts:
        - ports:
            - {port: "19099", protocol: TCP}
