spring:
  jackson2:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  data:
    redis:
      cluster:
        nodes: ${REDIS_CLUSTER_NODES}
      username: ${REDIS_USERNAME}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}

dubbo:
  protocol:
    name: tri
    port: ${DUBBO_PORT:50051}

organization:
  integrations:
    evaluation:
      enabled: ${EVALUATION_FACADE_ENABLED:true}
      course-group: ${EVALUATION_COURSE_FACADE_GROUP:course}
      exam-group: ${EVALUATION_EXAM_FACADE_GROUP:exam}
      score-group: ${EVALUATION_SCORE_FACADE_GROUP:score}
      version: ${EVALUATION_FACADE_SERVICE_VERSION:1.0.0}
      grpc-target: dns:///${EVALUATION_TRIPLE_SERVICE}.${EVALUATION_TRIPLE_NAMESPACE}.svc.cluster.local:50051
      grpc-deadline: ${EVALUATION_GRPC_DEADLINE:PT3S}
    redis:
      enabled: ${ORGANIZATION_REDIS_ENABLED:true}
    rabbit:
      enabled: ${ORGANIZATION_RABBIT_ENABLED:true}
  cache:
    user-ttl: ${ORGANIZATION_USER_CACHE_TTL:PT10M}
    grade-ttl: ${ORGANIZATION_GRADE_CACHE_TTL:PT30M}
    school-class-ttl: ${ORGANIZATION_SCHOOL_CLASS_CACHE_TTL:PT10M}
  command:
    idempotency-ttl: ${ORGANIZATION_IDEMPOTENCY_TTL:PT24H}

management:
  endpoint:
    health:
      show-details: never

logging:
  level:

egon:
  cola:
    component:
      id:
        enabled: true
        max-clock-backward: PT0.005S
        redis:
          enabled: true
          env: ${EGON_ID_REDIS_ENV}
          app: ${EGON_ID_REDIS_APP}
          lease-duration: ${EGON_ID_REDIS_LEASE_DURATION:5m}
          renew-interval: ${EGON_ID_REDIS_RENEW_INTERVAL:1m}
      cache:
        enabled: true
        node-id: ""
        key-prefix: egon:cola:cache:v2:${spring.application.name}
        tenant-mdc-key: tenantId
        second-evict-delay: PT5S
        redis:
          topic: "egon:cola:cache:event"
        l1:
          max-size: 10000
        ttl:
          l1-expire: PT5M
          l1-jitter: PT2M
          l2-expire: PT1H
          l2-jitter: PT20M
          null-expire: PT60S
        batch:
          max-keys: 1000
        lock:
          wait-time: PT0.5S
          lease-time: PT10S
      mybatis-plus:
        enabled: true
        tenant-id:
          mdc-key: tenantId
          ignored-tables: []
        audit:
          user-id-mdc-key: userId
        pagination:
          enabled: true
          max-page-size: 500
          overflow: false
        batch:
          default-size: 1000
          max-chunk-size: 1000
          max-collection-size: 10000
        block-attack:
          enabled: true
        optimistic-locker:
          enabled: true
        dynamic-table-name:
          enabled: false
          tables: {}
        illegal-sql:
          enabled: false
        ddl:
          enabled: true
          lock-timeout: PT30S
          statement-timeout: PT300S
          topology-ready-timeout: PT60S
        local-write-guard:
          enabled: true
          allowed-root-statements: {}
        sharding:
          enabled: true
          mode: ${APP_DATASOURCE_MODE:SHARDING}
          config-style: STRATEGY
          transaction-default-type: LOCAL
          data-sources:
            - name: master_data
              logical-name: master_data
              role: PRIMARY
              driver-class-name: ${ORGANIZATION_SHARDING_DRIVER_CLASS_NAME:org.postgresql.Driver}
              jdbc-url: ${ORGANIZATION_SHARDING_MASTER_DATA_URL}
              username: ${ORGANIZATION_SHARDING_USERNAME}
              password: "${ORGANIZATION_SHARDING_PASSWORD:}"
            - name: shard_0
              logical-name: shard_0
              role: PRIMARY
              driver-class-name: ${ORGANIZATION_SHARDING_DRIVER_CLASS_NAME:org.postgresql.Driver}
              jdbc-url: ${ORGANIZATION_SHARDING_SHARD_0_URL}
              username: ${ORGANIZATION_SHARDING_USERNAME}
              password: "${ORGANIZATION_SHARDING_PASSWORD:}"
            - name: shard_1
              logical-name: shard_1
              role: PRIMARY
              driver-class-name: ${ORGANIZATION_SHARDING_DRIVER_CLASS_NAME:org.postgresql.Driver}
              jdbc-url: ${ORGANIZATION_SHARDING_SHARD_1_URL}
              username: ${ORGANIZATION_SHARDING_USERNAME}
              password: "${ORGANIZATION_SHARDING_PASSWORD:}"
          tables:
            users:
              type: SINGLE
              data-source: master_data
            roles:
              type: SINGLE
              data-source: master_data
            permissions:
              type: SINGLE
              data-source: master_data
            user_roles:
              type: SINGLE
              data-source: master_data
            role_permissions:
              type: SINGLE
              data-source: master_data
            grades:
              type: SINGLE
              data-source: master_data
            school_classes:
              type: STANDARD_TENANT_ID
              sharding-column: tenant_id
            school_class_users:
              type: STANDARD_TENANT_ID
              sharding-column: tenant_id
