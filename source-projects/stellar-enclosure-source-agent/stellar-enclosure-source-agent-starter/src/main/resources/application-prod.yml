spring:
  config:
    import:
      - tianshu-baseline:${TIANSHU_CONFIG_BASELINE_FILE:/var/run/tianshu/config/baseline.json}
  security:
    oauth2:
      client:
        registration:
          tianshuregistration:
            provider: native-control
            client-id: ${NATIVE_CONTROL_CLIENT_ID:}
            client-secret: ${NATIVE_CONTROL_CLIENT_SECRET:}
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_basic
            scope: ${NATIVE_CONTROL_SCOPES:}
          native-tenant-one:
            provider: native-tenant-one
            client-id: ${NATIVE_SERVICE_CLIENT_ID:}
            client-secret: ${NATIVE_SERVICE_CLIENT_SECRET:}
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_basic
            scope: service:authorization:snapshot
          native-tenant-two:
            provider: native-tenant-two
            client-id: ${NATIVE_SERVICE_CLIENT_ID:}
            client-secret: ${NATIVE_SERVICE_CLIENT_SECRET:}
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_basic
            scope: service:authorization:snapshot
        provider:
          native-control:
            token-uri: ${NATIVE_CONTROL_TOKEN_URI:}
          native-tenant-one:
            token-uri: ${NATIVE_TENANT_ONE_TOKEN_URI:}
          native-tenant-two:
            token-uri: ${NATIVE_TENANT_TWO_TOKEN_URI:}

  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV4
      - org.redisson.spring.starter.RedissonAutoConfigurationV4
  jackson2:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  data:
    redis:
      cluster:
        nodes: ${REDIS_CLUSTER_NODES}
      username: ${REDIS_USERNAME}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
  datasource:
    url: ${AGENT_DB_URL}
    username: ${AGENT_DB_USERNAME}
    password: ${AGENT_DB_PASSWORD}
  flyway:
    enabled: ${AGENT_FLYWAY_ENABLED:true}
    locations: classpath:db/migration

egon:
  cola:
    component:
      id:
        enabled: true
        max-clock-backward: PT0.005S
        redis:
          enabled: true
          env: ${EGON_ID_REDIS_ENV}
          app: ${EGON_ID_REDIS_APP}
          lease-duration: ${EGON_ID_REDIS_LEASE_DURATION:5m}
          renew-interval: ${EGON_ID_REDIS_RENEW_INTERVAL:1m}
      rag:
        enabled: true
        dimensions: 1536
        vector-store-bean-name: knowledgeRagVectorStore
        embedding-models:
          openai-compatible:
            embedding-model-bean-name: knowledgeEmbeddingModel
        default-embedding-model: openai-compatible
        storage:
          type: LOCAL
          local:
            root: ${AGENT_RAG_STORAGE_ROOT:/var/lib/deep-research-agent/rag-documents}
        retrieval:
          default-top-k: 8
          max-top-k: 50
        validation:
          probe-on-startup: true
      transactional-outbox:
        enabled: true
        storage:
          mp:
            migration-mode: ${AGENT_OUTBOX_MIGRATION_MODE:false}
      cache:
        enabled: true
        node-id: ""
        key-prefix: egon:cola:cache:v2:${spring.application.name}
        tenant-mdc-key: tenantId
        second-evict-delay: PT5S
        redis:
          topic: "egon:cola:cache:event"
        l1:
          max-size: 10000
        ttl:
          l1-expire: PT5M
          l1-jitter: PT2M
          l2-expire: PT1H
          l2-jitter: PT20M
          null-expire: PT60S
        batch:
          max-keys: 1000
        lock:
          wait-time: PT0.5S
          lease-time: PT10S
      mybatis-plus:
        enabled: true
        tenant-id:
          mdc-key: tenantId
          ignored-tables: [egon_cola_outbox_message, ddl_history]
        audit:
          user-id-mdc-key: userId
        pagination:
          enabled: true
          max-page-size: 500
          overflow: false
        batch:
          default-size: 1000
          max-chunk-size: 1000
          max-collection-size: 10000
        block-attack:
          enabled: true
        optimistic-locker:
          enabled: true
        dynamic-table-name:
          enabled: false
          tables: {}
        illegal-sql:
          enabled: false
        ddl:
          enabled: false
          lock-timeout: PT30S
          statement-timeout: PT300S
          topology-ready-timeout: PT60S
        local-write-guard:
          enabled: true
          allowed-root-statements:
            "[top.egon.cola.archetype.source.agent.infrastructure.knowledge.dao.KnowledgeDocumentDAO.softDeleteByKnowledgeBaseId]": knowledge_base_id
        sharding:
          enabled: true
          mode: SHARDING
          config-style: STRATEGY
          transaction-default-type: LOCAL
          data-sources:
            - name: primary
              logical-name: primary
              role: PRIMARY
              driver-class-name: org.postgresql.Driver
              jdbc-url: ${AGENT_DB_URL:jdbc:postgresql://localhost:5432/agent}
              username: ${AGENT_DB_USERNAME:sa}
              password: "${AGENT_DB_PASSWORD:}"
          tables:
            knowledge_base:
              type: SINGLE
              data-source: primary
            knowledge_document:
              type: SINGLE
              data-source: primary
            egon_cola_outbox_message:
              type: SINGLE
              data-source: primary
              schema: egon_outbox
            ddl_history:
              type: SINGLE
              data-source: primary
              schema: egon_outbox
      rpc:
        enabled: false
        transport: h2c
        identity:
          env: ${APP_ENV:prod}
          host: ${POD_IP:${HOSTNAME:local}}
          instance-id: ${POD_UID:${HOSTNAME:local}}
        provider:
          enabled: false
          bind-address: ${RPC_BIND_ADDRESS:0.0.0.0}
          port: ${RPC_PORT:50051}
        consumer:
          enabled: false
          default-timeout-ms: 3000
          bindings: {}
      tianshu:
        tenant-id: ${TIANSHU_TENANT_ID:}
        enabled: ${TIANSHU_CONFIG_ENABLED:true}
        baseline:
          file: ${TIANSHU_CONFIG_BASELINE_FILE:/var/run/tianshu/config/baseline.json}
          scope:
            tenant-id: ${TIANSHU_TENANT_ID:}
            biz-code: ${TIANSHU_BIZ_CODE:deep-research}
            env: ${APP_ENV:prod}
            app-code: ${TIANSHU_APP_CODE:${spring.application.name}}
            resource-name: application.yml
          target:
            binding-id: ${TIANSHU_CONFIG_TARGET_BINDING_ID:}
            binding-revision: ${TIANSHU_CONFIG_TARGET_BINDING_REVISION:}
            cluster-id: ${CLUSTER_ID:}
            kubernetes-namespace: ${POD_NAMESPACE:}
            workload-uid: ${WORKLOAD_UID:}
            container-name: ${CONTAINER_NAME:application}
        delivery:
          enabled: ${TIANSHU_CONFIG_ENABLED:true}
          service-origin: ${TIANSHU_CONFIG_SERVICE_ORIGIN:http://tianshu-config.platform-system.svc.cluster.local}
          workload-token-file: ${TIANSHU_WORKLOAD_TOKEN_FILE:/var/run/tianshu/identity/workload-token}
          state-directory: ${TIANSHU_CONFIG_STATE_DIRECTORY:/var/run/tianshu/state}
          pod-uid: ${POD_UID:}
          registration-id: ${TIANSHU_CONFIG_REGISTRATION_ID:}
          app-id: ${TIANSHU_CONFIG_APP_ID:}
          identity-tenant-id: ${TIANSHU_CONFIG_IDENTITY_TENANT_ID:}
          expected-issuer: ${TIANSHU_CONFIG_ISSUER:}
          canonical-audience: ${TIANSHU_CONFIG_RESOURCE_URI:}
          request-timeout: ${TIANSHU_CONFIG_REQUEST_TIMEOUT:15s}
          poll-interval: ${TIANSHU_CONFIG_POLL_INTERVAL:30s}
          max-stale: ${TIANSHU_CONFIG_MAX_STALE:5m}
          allow-offline-start: false
          baseline-valid-until: ${TIANSHU_CONFIG_BASELINE_VALID_UNTIL:}
      yuheng:
        openapi:
          enabled: ${OPENAPI_GOVERNANCE_ENABLED:false}
    platform:
      tianquan:
        shoubing:
          enabled: true
          register-filter: false
          issuer: ${TIANQUAN_SHOUBING_ISSUER:}
          jwk-set-uri: ${TIANQUAN_SHOUBING_JWK_SET_URI:}
          resource-server-id: ${TIANQUAN_SHOUBING_RESOURCE_SERVER_ID:}
          resource-uri: ${TIANQUAN_SHOUBING_RESOURCE_URI:}
          clock-skew: PT30S
          trusted-issuers:
            tenant-one:
              issuer: ${NATIVE_TENANT_ONE_ISSUER:}
              jwks-uri: ${NATIVE_TENANT_ONE_JWKS_URI:}
              realm-key: ${NATIVE_TENANT_ONE_REALM_KEY:}
              realm-type: TENANT
              tenant-id: ${NATIVE_TENANT_ONE_ID:}
              status: ACTIVE
              trust-version: ${NATIVE_TENANT_ONE_TRUST_VERSION:1}
            tenant-two:
              issuer: ${NATIVE_TENANT_TWO_ISSUER:}
              jwks-uri: ${NATIVE_TENANT_TWO_JWKS_URI:}
              realm-key: ${NATIVE_TENANT_TWO_REALM_KEY:}
              realm-type: TENANT
              tenant-id: ${NATIVE_TENANT_TWO_ID:}
              status: ACTIVE
              trust-version: ${NATIVE_TENANT_TWO_TRUST_VERSION:1}
          revocation:
            mode: STRICT_SHARED
            primary-endpoint: ${OAUTH_REVOCATION_PRIMARY_ENDPOINT:}
            timeout: PT0.5S
            epoch: ${OAUTH_REVOCATION_EPOCH:}
          jwks-cache:
            ttl: PT300S
            max-issuers: 1000
            connect-timeout: PT2S
            read-timeout: PT5S
          usage-observation:
            enabled: true
            receiver: APPLICATION
            fallback-issuer: ${TIANQUAN_SHOUBING_ISSUER:}
            allow-local-plaintext: false
          audit:
            stream: egon:oauth:audit:v1
            spool-directory: ${NATIVE_OAUTH_AUDIT_SPOOL_DIRECTORY:}
            spool-max-bytes: 1073741824
            hmac-key-file: ${NATIVE_OAUTH_AUDIT_HMAC_KEY_FILE:}
            replay-initial-delay: 5000
            replay-delay: 5000
            delivery:
              receipt-ttl: PT1H
              confirmation-timeout: PT30S
              batch-size: 100
          service-client:
            app-id: stellar-enclosure-source-agent
            registration-id: tianshuregistration
            credential-versions:
              tianshuregistration: ${NATIVE_CONTROL_CREDENTIAL_VERSION:1}
              native-tenant-one: ${NATIVE_TENANT_ONE_CREDENTIAL_VERSION:1}
              native-tenant-two: ${NATIVE_TENANT_TWO_CREDENTIAL_VERSION:1}
            # Deployment manifest supplies exact positive tenant IDs; there is no default tenant selection.
            tenant-registration-ids: {}
            renewal-skew: PT60S
          rpc:
            enabled: false
            consumer:
              enabled: false
              bindings: {}
            provider:
              methods: {}
        jianshen:
          enabled: true
          register-filter: false
          system-code: stellar-enclosure-source-agent
          user-scope-policy:
            enabled: true
            permission-scopes:
              "[stellar-enclosure-source-agent:research:start]": ["stellar-enclosure-source-agent:research:start"]
              "[stellar-enclosure-source-agent:knowledge-base:create]": ["stellar-enclosure-source-agent:knowledge-base:create"]
              "[stellar-enclosure-source-agent:knowledge-base:list]": ["stellar-enclosure-source-agent:knowledge-base:list"]
              "[stellar-enclosure-source-agent:knowledge-base:read]": ["stellar-enclosure-source-agent:knowledge-base:read"]
              "[stellar-enclosure-source-agent:knowledge-base:update]": ["stellar-enclosure-source-agent:knowledge-base:update"]
              "[stellar-enclosure-source-agent:knowledge-base:delete]": ["stellar-enclosure-source-agent:knowledge-base:delete"]
              "[stellar-enclosure-source-agent:knowledge-document:upload]": ["stellar-enclosure-source-agent:knowledge-document:upload"]
              "[stellar-enclosure-source-agent:knowledge-document:list]": ["stellar-enclosure-source-agent:knowledge-document:list"]
              "[stellar-enclosure-source-agent:knowledge-document:read]": ["stellar-enclosure-source-agent:knowledge-document:read"]
              "[stellar-enclosure-source-agent:knowledge-document:reingest]": ["stellar-enclosure-source-agent:knowledge-document:reingest"]
              "[stellar-enclosure-source-agent:knowledge-document:delete]": ["stellar-enclosure-source-agent:knowledge-document:delete"]
              "[stellar-enclosure-source-agent:knowledge:retrieve]": ["stellar-enclosure-source-agent:knowledge:retrieve"]
              "[stellar-enclosure-source-agent:knowledge:chat]": ["stellar-enclosure-source-agent:knowledge:chat"]
          authorization:
            endpoint: ${TIANQUAN_JIANSHEN_AUTHORIZATION_ENDPOINT:}
            cache-ttl: PT5M
            maximum-jitter: PT30S
            near-cache-ttl: PT5S
            fetch-timeout: PT1S
            service-token:
              enabled: true
              resource-uri: ${TIANQUAN_JIANSHEN_RESOURCE_URI:}
              scopes: service:authorization:snapshot
              renewal-skew: PT60S
          runtime:
            redis-enabled: true
            redis-address: ${RBAC3_RUNTIME_REDIS_ADDRESS:}
            database: ${RBAC3_RUNTIME_REDIS_DATABASE:0}
            password-file: ${RBAC3_RUNTIME_REDIS_PASSWORD_FILE:}
            timeout: PT2S

agent:
  deep-research:
    runtime:
      max-concurrent-runs: ${DEEP_RESEARCH_MAX_CONCURRENT_RUNS:4}
      max-duration: ${DEEP_RESEARCH_MAX_DURATION:PT5M}
      max-sources: ${DEEP_RESEARCH_MAX_SOURCES:20}
      heartbeat-interval: ${DEEP_RESEARCH_HEARTBEAT_INTERVAL:PT15S}
    model:
      base-url: ${DEEP_RESEARCH_MODEL_BASE_URL}
      api-key: ${DEEP_RESEARCH_MODEL_API_KEY}
      model-name: ${DEEP_RESEARCH_MODEL_NAME}
    docs:
      enabled: false
    search:
      mcp:
        base-uri: ${DEEP_RESEARCH_MCP_BASE_URI}
        sse-endpoint: ${DEEP_RESEARCH_MCP_SSE_ENDPOINT}
        api-key: ${DEEP_RESEARCH_MCP_API_KEY}
        request-timeout: ${DEEP_RESEARCH_MCP_REQUEST_TIMEOUT:PT15S}
  knowledge:
    embedding:
      # 嵌入模型的供应商端点、凭据与模型名；向量维度只由 egon.cola.component.rag.dimensions 一处给出。
      base-url: ${AGENT_KNOWLEDGE_EMBEDDING_BASE_URL}
      api-key: ${AGENT_KNOWLEDGE_EMBEDDING_API_KEY}
      model-name: ${AGENT_KNOWLEDGE_EMBEDDING_MODEL}
    runtime:
      qa-max-concurrent: ${AGENT_KNOWLEDGE_QA_MAX_CONCURRENT:4}
      max-upload-bytes: ${AGENT_KNOWLEDGE_MAX_UPLOAD_BYTES:20971520}
      max-documents-per-base: ${AGENT_KNOWLEDGE_MAX_DOCUMENTS_PER_BASE:10000}
      qa-max-duration: ${AGENT_KNOWLEDGE_QA_MAX_DURATION:PT2M}

spring.ai.openai:
  base-url: ${DEEP_RESEARCH_MODEL_BASE_URL}
  api-key: ${DEEP_RESEARCH_MODEL_API_KEY}
  chat.options.model: ${DEEP_RESEARCH_MODEL_NAME}

springdoc:
  api-docs.enabled: false
  swagger-ui.enabled: false

mybatis-plus:
  mapper-locations: classpath*:mybatis/mapper/**/*.xml,classpath*:mapper/outbox/**/*.xml

server:
  ssl:
    enabled: false
