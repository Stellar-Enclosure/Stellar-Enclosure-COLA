spring:
  config:
    import:
      - tianshu-baseline:${TIANSHU_CONFIG_BASELINE_FILE:/var/run/tianshu/config/baseline.json}
  jackson2:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  security:
    oauth2:
      client:
        registration:
          tianshuregistration:
            provider: native-control
            client-id: ${NATIVE_CONTROL_CLIENT_ID:}
            client-secret: ${NATIVE_CONTROL_CLIENT_SECRET:}
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_basic
            scope: ${NATIVE_CONTROL_SCOPES:}
          native-tenant-one:
            provider: native-tenant-one
            client-id: ${NATIVE_SERVICE_CLIENT_ID:}
            client-secret: ${NATIVE_SERVICE_CLIENT_SECRET:}
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_basic
            scope: ${NATIVE_SERVICE_SCOPES:}
          native-tenant-two:
            provider: native-tenant-two
            client-id: ${NATIVE_SERVICE_CLIENT_ID:}
            client-secret: ${NATIVE_SERVICE_CLIENT_SECRET:}
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_basic
            scope: ${NATIVE_SERVICE_SCOPES:}
        provider:
          native-control:
            token-uri: ${NATIVE_CONTROL_TOKEN_URI:}
          native-tenant-one:
            token-uri: ${NATIVE_TENANT_ONE_TOKEN_URI:}
          native-tenant-two:
            token-uri: ${NATIVE_TENANT_TWO_TOKEN_URI:}

  data:
    redis:
      cluster:
        nodes: ${REDIS_CLUSTER_NODES}
      username: ${REDIS_USERNAME}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV4
app:
  integrations:
    organization:
      enabled: ${ORGANIZATION_FACADE_ENABLED:true}
      biz-code: ${ORGANIZATION_FACADE_BIZ_CODE:student-management}
      app-code: ${ORGANIZATION_FACADE_APP_CODE:}
      group: ${ORGANIZATION_FACADE_GROUP:student-management-organization}
      version: ${ORGANIZATION_FACADE_SERVICE_VERSION:1.0.0}
      timeout-ms: ${ORGANIZATION_FACADE_TIMEOUT_MS:3000}
      application-namespace: ${ORGANIZATION_APPLICATION_NAMESPACE:}
    rabbitmq:
      enabled: ${RABBITMQ_ENABLED:true}
      listener-auto-startup: ${RABBITMQ_LISTENER_AUTO_STARTUP:true}

management:
  endpoint:
    health:
      show-details: never

egon:
  cola:
    component:
      id:
        enabled: true
        max-clock-backward: PT0.005S
        redis:
          enabled: true
          env: ${EGON_ID_REDIS_ENV}
          app: ${EGON_ID_REDIS_APP}
          lease-duration: ${EGON_ID_REDIS_LEASE_DURATION:5m}
          renew-interval: ${EGON_ID_REDIS_RENEW_INTERVAL:1m}
      cache:
        enabled: true
        node-id: ""
        key-prefix: egon:cola:cache:v2:${spring.application.name}
        tenant-mdc-key: tenantId
        second-evict-delay: PT5S
        redis:
          topic: "egon:cola:cache:event"
        l1:
          max-size: 10000
        ttl:
          l1-expire: PT5M
          l1-jitter: PT2M
          l2-expire: PT1H
          l2-jitter: PT20M
          null-expire: PT60S
        batch:
          max-keys: 1000
        lock:
          wait-time: PT0.5S
          lease-time: PT10S
      mybatis-plus:
        enabled: true
        tenant-id:
          mdc-key: tenantId
          ignored-tables: []
        audit:
          user-id-mdc-key: userId
        pagination:
          enabled: true
          max-page-size: 500
          overflow: false
        batch:
          default-size: 1000
          max-chunk-size: 1000
          max-collection-size: 10000
        block-attack:
          enabled: true
        optimistic-locker:
          enabled: true
        dynamic-table-name:
          enabled: false
          tables: {}
        illegal-sql:
          enabled: false
        ddl:
          enabled: true
          lock-timeout: PT30S
          statement-timeout: PT300S
          topology-ready-timeout: PT60S
        local-write-guard:
          enabled: true
          allowed-root-statements: {}
        sharding:
          enabled: true
          mode: ${APP_DATASOURCE_MODE:SHARDING}
          config-style: STRATEGY
          transaction-default-type: LOCAL
          data-sources:
            - name: master_data
              logical-name: master_data
              role: PRIMARY
              driver-class-name: ${EVALUATION_SHARDING_DRIVER_CLASS_NAME:org.postgresql.Driver}
              jdbc-url: ${EVALUATION_SHARDING_MASTER_DATA_URL}
              username: ${EVALUATION_SHARDING_USERNAME}
              password: "${EVALUATION_SHARDING_PASSWORD:}"
            - name: shard_0
              logical-name: shard_0
              role: PRIMARY
              driver-class-name: ${EVALUATION_SHARDING_DRIVER_CLASS_NAME:org.postgresql.Driver}
              jdbc-url: ${EVALUATION_SHARDING_SHARD_0_URL}
              username: ${EVALUATION_SHARDING_USERNAME}
              password: "${EVALUATION_SHARDING_PASSWORD:}"
            - name: shard_1
              logical-name: shard_1
              role: PRIMARY
              driver-class-name: ${EVALUATION_SHARDING_DRIVER_CLASS_NAME:org.postgresql.Driver}
              jdbc-url: ${EVALUATION_SHARDING_SHARD_1_URL}
              username: ${EVALUATION_SHARDING_USERNAME}
              password: "${EVALUATION_SHARDING_PASSWORD:}"
          tables:
            evaluation_course:
              type: SINGLE
              data-source: master_data
            evaluation_course_schedule:
              type: STANDARD_TENANT_ID
              sharding-column: tenant_id
            evaluation_exam:
              type: STANDARD_TENANT_ID
              sharding-column: tenant_id
            evaluation_exam_paper:
              type: STANDARD_TENANT_ID
              sharding-column: tenant_id
            evaluation_score:
              type: STANDARD_TENANT_ID
              sharding-column: tenant_id
      rpc:
        enabled: ${RPC_ENABLED:true}
        transport: h2c
        identity:
          env: ${APP_ENV:prod}
          host: ${POD_IP:${HOSTNAME:local}}
          instance-id: ${POD_UID:${HOSTNAME:local}}
        provider:
          enabled: ${RPC_ENABLED:true}
          bind-address: ${RPC_BIND_ADDRESS:0.0.0.0}
          port: ${RPC_PORT:50051}
        consumer:
          enabled: ${RPC_CONSUMER_ENABLED:true}
          default-timeout-ms: 3000
          bindings:
            organization-user-read:
              version: ${ORGANIZATION_RPC_BINDING_VERSION:1}
              namespace: ${ORGANIZATION_RPC_NAMESPACE}
              service: ${ORGANIZATION_RPC_SERVICE}
              port: ${ORGANIZATION_RPC_PORT:50051}
              methods:
                - top.egon.cola.organization.facade.rpc.v1.UserService/GetUser
            organization-class-read:
              version: ${ORGANIZATION_RPC_BINDING_VERSION:1}
              namespace: ${ORGANIZATION_RPC_NAMESPACE}
              service: ${ORGANIZATION_RPC_SERVICE}
              port: ${ORGANIZATION_RPC_PORT:50051}
              methods:
                - top.egon.cola.organization.facade.rpc.v1.SchoolClassService/GetSchoolClass
      tianshu:
        tenant-id: ${TIANSHU_TENANT_ID:}
        enabled: ${TIANSHU_CONFIG_ENABLED:true}
        baseline:
          file: ${TIANSHU_CONFIG_BASELINE_FILE:/var/run/tianshu/config/baseline.json}
          scope:
            tenant-id: ${TIANSHU_TENANT_ID:}
            biz-code: ${TIANSHU_BIZ_CODE:student-management}
            env: ${APP_ENV:prod}
            app-code: ${TIANSHU_APP_CODE:${spring.application.name}}
            resource-name: application.yml
          target:
            binding-id: ${TIANSHU_CONFIG_TARGET_BINDING_ID:}
            binding-revision: ${TIANSHU_CONFIG_TARGET_BINDING_REVISION:}
            cluster-id: ${CLUSTER_ID:}
            kubernetes-namespace: ${POD_NAMESPACE:}
            workload-uid: ${WORKLOAD_UID:}
            container-name: ${CONTAINER_NAME:application}
        delivery:
          enabled: ${TIANSHU_CONFIG_ENABLED:true}
          service-origin: ${TIANSHU_CONFIG_SERVICE_ORIGIN:http://tianshu-config.platform-system.svc.cluster.local}
          workload-token-file: ${TIANSHU_WORKLOAD_TOKEN_FILE:/var/run/tianshu/identity/workload-token}
          state-directory: ${TIANSHU_CONFIG_STATE_DIRECTORY:/var/run/tianshu/state}
          pod-uid: ${POD_UID:}
          registration-id: ${TIANSHU_CONFIG_REGISTRATION_ID:}
          app-id: ${TIANSHU_CONFIG_APP_ID:}
          identity-tenant-id: ${TIANSHU_CONFIG_IDENTITY_TENANT_ID:}
          expected-issuer: ${TIANSHU_CONFIG_ISSUER:}
          canonical-audience: ${TIANSHU_CONFIG_RESOURCE_URI:}
          request-timeout: ${TIANSHU_CONFIG_REQUEST_TIMEOUT:15s}
          poll-interval: ${TIANSHU_CONFIG_POLL_INTERVAL:30s}
          max-stale: ${TIANSHU_CONFIG_MAX_STALE:5m}
          allow-offline-start: false
          baseline-valid-until: ${TIANSHU_CONFIG_BASELINE_VALID_UNTIL:}
      yuheng:
        openapi:
          enabled: ${OPENAPI_GOVERNANCE_ENABLED:false}
    platform:
      tianquan:
        shoubing:
          enabled: true
          register-filter: false
          issuer: ${TIANQUAN_SHOUBING_ISSUER:}
          jwk-set-uri: ${TIANQUAN_SHOUBING_JWK_SET_URI:}
          resource-server-id: ${TIANQUAN_SHOUBING_RESOURCE_SERVER_ID:}
          resource-uri: ${TIANQUAN_SHOUBING_RESOURCE_URI:}
          clock-skew: PT30S
          trusted-issuers:
            tenant-one:
              issuer: ${NATIVE_TENANT_ONE_ISSUER:}
              jwks-uri: ${NATIVE_TENANT_ONE_JWKS_URI:}
              realm-key: ${NATIVE_TENANT_ONE_REALM_KEY:}
              realm-type: TENANT
              tenant-id: ${NATIVE_TENANT_ONE_ID:}
              status: ACTIVE
              trust-version: ${NATIVE_TENANT_ONE_TRUST_VERSION:1}
            tenant-two:
              issuer: ${NATIVE_TENANT_TWO_ISSUER:}
              jwks-uri: ${NATIVE_TENANT_TWO_JWKS_URI:}
              realm-key: ${NATIVE_TENANT_TWO_REALM_KEY:}
              realm-type: TENANT
              tenant-id: ${NATIVE_TENANT_TWO_ID:}
              status: ACTIVE
              trust-version: ${NATIVE_TENANT_TWO_TRUST_VERSION:1}
          revocation:
            mode: STRICT_SHARED
            primary-endpoint: ${OAUTH_REVOCATION_PRIMARY_ENDPOINT:}
            timeout: PT0.5S
            epoch: ${OAUTH_REVOCATION_EPOCH:}
          jwks-cache:
            ttl: PT300S
            max-issuers: 1000
            connect-timeout: PT2S
            read-timeout: PT5S
          usage-observation:
            enabled: true
            receiver: APPLICATION
            fallback-issuer: ${TIANQUAN_SHOUBING_ISSUER:}
            allow-local-plaintext: false
          audit:
            stream: egon:oauth:audit:v1
            spool-directory: ${NATIVE_OAUTH_AUDIT_SPOOL_DIRECTORY:}
            spool-max-bytes: 1073741824
            hmac-key-file: ${NATIVE_OAUTH_AUDIT_HMAC_KEY_FILE:}
            replay-initial-delay: 5000
            replay-delay: 5000
            delivery:
              receipt-ttl: PT1H
              confirmation-timeout: PT30S
              batch-size: 100
          service-client:
            app-id: stellar-enclosure-source-service
            registration-id: tianshuregistration
            credential-versions:
              tianshuregistration: ${NATIVE_CONTROL_CREDENTIAL_VERSION:1}
              native-tenant-one: ${NATIVE_TENANT_ONE_CREDENTIAL_VERSION:1}
              native-tenant-two: ${NATIVE_TENANT_TWO_CREDENTIAL_VERSION:1}
            # Deployment manifest supplies exact positive tenant IDs; there is no default tenant selection.
            tenant-registration-ids: {}
            renewal-skew: PT60S
          rpc:
            enabled: true
            consumer:
              enabled: true
              bindings:
                organization-user-read:
                  service-name: top.egon.cola.organization.facade.rpc.v1.UserService
                  group: ${app.integrations.organization.group}
                  version: ${app.integrations.organization.version}
                  full-method-name: top.egon.cola.organization.facade.rpc.v1.UserService/GetUser
                  transport-binding-id: organization-user-read
                  transport-binding-version: ${ORGANIZATION_RPC_BINDING_VERSION:1}
                  process-identity:
                    "[applicationName]": ${spring.application.name}
                    "[env]": ${APP_ENV:dev}
                  mode: SERVICE
                  app-id: stellar-enclosure-source-service
                  resource-uri: ${ORGANIZATION_RESOURCE_URI:}
                  scope-context: TENANT
                  tenant-registration-ids: {}
                  scopes: ["${app.integrations.organization.application-namespace}:user:read"]
                organization-class-read:
                  service-name: top.egon.cola.organization.facade.rpc.v1.SchoolClassService
                  group: ${app.integrations.organization.group}
                  version: ${app.integrations.organization.version}
                  full-method-name: top.egon.cola.organization.facade.rpc.v1.SchoolClassService/GetSchoolClass
                  transport-binding-id: organization-class-read
                  transport-binding-version: ${ORGANIZATION_RPC_BINDING_VERSION:1}
                  process-identity:
                    "[applicationName]": ${spring.application.name}
                    "[env]": ${APP_ENV:dev}
                  mode: SERVICE
                  app-id: stellar-enclosure-source-service
                  resource-uri: ${ORGANIZATION_RESOURCE_URI:}
                  scope-context: TENANT
                  tenant-registration-ids: {}
                  scopes: ["${app.integrations.organization.application-namespace}:school-class:read"]
            provider:
              enabled: true
              methods:
                "[top.egon.cola.evaluation.facade.rpc.v1.CourseService/CreateCourse]":
                  required: true
                  principal-kind: SERVICE
                  scope-context: TENANT
                  expected-resource-uri: ${TIANQUAN_SHOUBING_RESOURCE_URI:}
                  required-scopes: ["stellar-enclosure-source-service:course:create"]
                "[top.egon.cola.evaluation.facade.rpc.v1.CourseService/ScheduleCourse]":
                  required: true
                  principal-kind: SERVICE
                  scope-context: TENANT
                  expected-resource-uri: ${TIANQUAN_SHOUBING_RESOURCE_URI:}
                  required-scopes: ["stellar-enclosure-source-service:course:schedule"]
                "[top.egon.cola.evaluation.facade.rpc.v1.CourseService/GetCourse]":
                  required: true
                  principal-kind: SERVICE
                  scope-context: TENANT
                  expected-resource-uri: ${TIANQUAN_SHOUBING_RESOURCE_URI:}
                  required-scopes: ["stellar-enclosure-source-service:course:read"]
                "[top.egon.cola.evaluation.facade.rpc.v1.CourseService/PageCourses]":
                  required: true
                  principal-kind: SERVICE
                  scope-context: TENANT
                  expected-resource-uri: ${TIANQUAN_SHOUBING_RESOURCE_URI:}
                  required-scopes: ["stellar-enclosure-source-service:course:list"]
                "[top.egon.cola.evaluation.facade.rpc.v1.ExamService/CreateExam]":
                  required: true
                  principal-kind: SERVICE
                  scope-context: TENANT
                  expected-resource-uri: ${TIANQUAN_SHOUBING_RESOURCE_URI:}
                  required-scopes: ["stellar-enclosure-source-service:exam:create"]
                "[top.egon.cola.evaluation.facade.rpc.v1.ExamService/AttachPaper]":
                  required: true
                  principal-kind: SERVICE
                  scope-context: TENANT
                  expected-resource-uri: ${TIANQUAN_SHOUBING_RESOURCE_URI:}
                  required-scopes: ["stellar-enclosure-source-service:exam:attach-paper"]
                "[top.egon.cola.evaluation.facade.rpc.v1.ExamService/PublishExam]":
                  required: true
                  principal-kind: SERVICE
                  scope-context: TENANT
                  expected-resource-uri: ${TIANQUAN_SHOUBING_RESOURCE_URI:}
                  required-scopes: ["stellar-enclosure-source-service:exam:publish"]
                "[top.egon.cola.evaluation.facade.rpc.v1.ExamService/GetExam]":
                  required: true
                  principal-kind: SERVICE
                  scope-context: TENANT
                  expected-resource-uri: ${TIANQUAN_SHOUBING_RESOURCE_URI:}
                  required-scopes: ["stellar-enclosure-source-service:exam:read"]
                "[top.egon.cola.evaluation.facade.rpc.v1.ScoreService/RecordScore]":
                  required: true
                  principal-kind: SERVICE
                  scope-context: TENANT
                  expected-resource-uri: ${TIANQUAN_SHOUBING_RESOURCE_URI:}
                  required-scopes: ["stellar-enclosure-source-service:score:record"]
                "[top.egon.cola.evaluation.facade.rpc.v1.ScoreService/GetScore]":
                  required: true
                  principal-kind: SERVICE
                  scope-context: TENANT
                  expected-resource-uri: ${TIANQUAN_SHOUBING_RESOURCE_URI:}
                  required-scopes: ["stellar-enclosure-source-service:score:read"]
                "[top.egon.cola.evaluation.facade.rpc.v1.ScoreService/PageScores]":
                  required: true
                  principal-kind: SERVICE
                  scope-context: TENANT
                  expected-resource-uri: ${TIANQUAN_SHOUBING_RESOURCE_URI:}
                  required-scopes: ["stellar-enclosure-source-service:score:list"]

server:
  ssl:
    enabled: false

logging:
  level:
