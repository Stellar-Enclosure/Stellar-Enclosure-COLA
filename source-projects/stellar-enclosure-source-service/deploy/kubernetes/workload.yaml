# Release input example. The deployment assembler supplies the approved namespace,
# immutable image digest and input revisions before applying these objects.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: stellar-enclosure-source-service
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: stellar-enclosure-source-service-stable
  labels:
    app.kubernetes.io/name: stellar-enclosure-source-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: stellar-enclosure-source-service
      release: stable
  template:
    metadata:
      labels:
        app.kubernetes.io/name: stellar-enclosure-source-service
        release: stable
        stellar.io/management-port: "9090"
        stellar.io/network-access: gamma
    spec:
      serviceAccountName: stellar-enclosure-source-service
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: application
          image: registry.example.invalid/stellar-enclosure-source-service:replace-me
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - {name: http, containerPort: 8081}
            - {name: management, containerPort: 9090}
            - {name: grpc, containerPort: 50051}
          envFrom:
            - configMapRef:
                name: stellar-enclosure-source-service-settings-v1
            - secretRef:
                name: stellar-enclosure-source-service-credentials-v1
          env:
            - {name: SPRING_PROFILES_ACTIVE, value: prod}
            - {name: SERVER_PORT, value: "8081"}
            - {name: SERVER_SHUTDOWN, value: graceful}
            - {name: SPRING_LIFECYCLE_TIMEOUT_PER_SHUTDOWN_PHASE, value: 30s}
            - {name: MANAGEMENT_SERVER_PORT, value: "9090"}
            - {name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED, value: "true"}
            - {name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE, value: health}
            - {name: CONTAINER_NAME, value: application}
            - {name: RPC_PORT, value: "50051"}
            - name: POD_NAME
              valueFrom:
                fieldRef: {fieldPath: metadata.name}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef: {fieldPath: metadata.namespace}
            - name: POD_UID
              valueFrom:
                fieldRef: {fieldPath: metadata.uid}
            - name: POD_IP
              valueFrom:
                fieldRef: {fieldPath: status.podIP}
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: management
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: management
            periodSeconds: 15
            timeoutSeconds: 2
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 1Gi}
          volumeMounts:
            - {name: temporary, mountPath: /tmp}
            - {name: logs, mountPath: /app/logs}
            - name: config-baseline
              mountPath: /var/run/tianshu/config
              readOnly: true
            - name: workload-identity
              mountPath: /var/run/tianshu/identity
              readOnly: true
            - {name: config-state, mountPath: /var/run/tianshu/state}
      volumes:
        - name: temporary
          emptyDir: {sizeLimit: 128Mi}
        - name: logs
          emptyDir: {sizeLimit: 128Mi}
        - name: config-state
          emptyDir: {sizeLimit: 32Mi}
        - name: config-baseline
          configMap:
            name: stellar-enclosure-source-service-baseline-v1
            items:
              - {key: baseline.json, path: baseline.json}
        - name: workload-identity
          projected:
            sources:
              - serviceAccountToken:
                  path: workload-token
                  audience: tianshu-config
                  expirationSeconds: 600
---
apiVersion: v1
kind: Service
metadata:
  name: stellar-enclosure-source-service-http
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: stellar-enclosure-source-service
    release: stable
  ports:
    - {name: http, port: 8081, targetPort: http, appProtocol: http}
---
apiVersion: v1
kind: Service
metadata:
  name: stellar-enclosure-source-service-rpc
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: stellar-enclosure-source-service
  ports:
    - name: grpc
      port: 50051
      targetPort: 19099
      appProtocol: kubernetes.io/h2c
---
apiVersion: v1
kind: Service
metadata:
  name: stellar-enclosure-source-service-rpc-stable
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: stellar-enclosure-source-service
    release: stable
  ports:
    - name: grpc
      port: 50051
      targetPort: grpc
      appProtocol: kubernetes.io/h2c
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: stellar-enclosure-source-service-rpc
spec:
  parentRefs:
    - group: ""
      kind: Service
      name: stellar-enclosure-source-service-rpc
      port: 50051
  rules:
    - matches:
        - method: {service: top.egon.cola.evaluation.facade.rpc.v1.CourseService, method: CreateCourse}
        - method: {service: top.egon.cola.evaluation.facade.rpc.v1.CourseService, method: ScheduleCourse}
        - method: {service: top.egon.cola.evaluation.facade.rpc.v1.CourseService, method: GetCourse}
        - method: {service: top.egon.cola.evaluation.facade.rpc.v1.CourseService, method: PageCourses}
        - method: {service: top.egon.cola.evaluation.facade.rpc.v1.ExamService, method: CreateExam}
        - method: {service: top.egon.cola.evaluation.facade.rpc.v1.ExamService, method: AttachPaper}
        - method: {service: top.egon.cola.evaluation.facade.rpc.v1.ExamService, method: PublishExam}
        - method: {service: top.egon.cola.evaluation.facade.rpc.v1.ExamService, method: GetExam}
        - method: {service: top.egon.cola.evaluation.facade.rpc.v1.ScoreService, method: RecordScore}
        - method: {service: top.egon.cola.evaluation.facade.rpc.v1.ScoreService, method: GetScore}
        - method: {service: top.egon.cola.evaluation.facade.rpc.v1.ScoreService, method: PageScores}
      backendRefs:
        - {name: stellar-enclosure-source-service-rpc-stable, port: 50051, weight: 100}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: stellar-enclosure-source-service-rpc-fallback
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: stellar-enclosure-source-service
      stellar.io/network-access: gamma
  ingressDeny:
    - fromEntities: [all]
      toPorts:
        - ports:
            - {port: "19099", protocol: TCP}
