name: Build and unit tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          path: workspace/app
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Build and verify the permission producer
        working-directory: workspace/app
        run: |
          ./mvnw -B -ntp -Ppermission-producer -DskipTests=false \
            -Dpermission.commit="$(git rev-parse HEAD)" -Dpermission.buildId="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" clean verify
      - name: Collect exact producer artifacts
        working-directory: workspace/app
        run: |
          python3 - <<'PY'
          import json, pathlib, re, shutil
          root = pathlib.Path.cwd().resolve()
          bundle = root.parent / 'permission-bundle'
          config = json.loads((root / 'permission-producers.json').read_text())
          for producer in config['producers']:
              module, artifact = producer['module'], producer['artifactFile']
              if not re.fullmatch(r'[a-z][a-z0-9-]{0,127}', module) or not re.fullmatch(r'[a-z][a-z0-9-]{0,127}-exec\.jar', artifact):
                  raise SystemExit('Invalid producer inventory')
              source = (root / producer['sourceModule'] / 'target').resolve()
              if not source.is_relative_to(root):
                  raise SystemExit('Invalid producer source path')
              destination = bundle / module / 'target'
              destination.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source / artifact, destination / artifact)
              shutil.copytree(source / 'permissions', destination / 'permissions')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: permission-java-artifacts
          path: workspace/permission-bundle/
          if-no-files-found: error
          retention-days: 14
  permission-validate:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PERMISSION_SDK_ROOT: ${{ github.workspace }}/permission-tools
      PERMISSION_BUILD_ROOT: ${{ github.workspace }}/permission-temp/permission-build
      PERMISSION_OUTPUT_ROOT: ${{ github.workspace }}/permission-temp/permission-results
      PERMISSION_CONTRACT_ARTIFACT_FILE: ${{ github.workspace }}/permission-temp/permission-contract.jar
      PERMISSION_CONTRACT_ARTIFACT_URL: ${{ vars.PERMISSION_CONTRACT_ARTIFACT_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          path: source
          persist-credentials: false
      - name: Read immutable SDK toolchain pin
        id: pin
        working-directory: source
        run: echo "commit=$(python3 scripts/permission-ci.py pin)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          repository: Stellar-Enclosure/web-sdk
          ref: ${{ steps.pin.outputs.commit }}
          path: permission-tools
          token: ${{ secrets.STELLAR_ENCLOSURE_READ_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: permission-tools/package-lock.json
      - name: Install the pinned tool dependencies
        working-directory: permission-tools
        run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: permission-java-artifacts
          path: ${{ github.workspace }}/permission-temp/permission-build
      - name: Prepare the fixed permission contract
        working-directory: source
        run: |
          python3 - <<'PY'
          import os, urllib.parse
          url = urllib.parse.urlsplit(os.environ['PERMISSION_CONTRACT_ARTIFACT_URL'])
          if url.scheme != 'https' or not url.hostname or url.username or url.password or url.query or url.fragment:
              raise SystemExit('A non-secret HTTPS contract artifact URL is required')
          PY
          mkdir -p "$(dirname "$PERMISSION_CONTRACT_ARTIFACT_FILE")"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --max-filesize 67108864 "$PERMISSION_CONTRACT_ARTIFACT_URL" --output "$PERMISSION_CONTRACT_ARTIFACT_FILE"
          python3 scripts/permission-ci.py prepare
      - name: Verify packaged permission artifacts
        working-directory: source
        run: python3 scripts/permission-ci.py validate
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: permission-offline-validation
          path: ${{ github.workspace }}/permission-temp/permission-results/
          if-no-files-found: ignore
