spring:
  jackson2:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  security:
    oauth2:
      client:
        registration:
          tianshuregistration:
            provider: native-control
            client-id: ${NATIVE_CONTROL_CLIENT_ID:}
            client-secret: ${NATIVE_CONTROL_CLIENT_SECRET:}
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_basic
            scope: ${NATIVE_CONTROL_SCOPES:}
          native-tenant-one:
            provider: native-tenant-one
            client-id: ${NATIVE_SERVICE_CLIENT_ID:}
            client-secret: ${NATIVE_SERVICE_CLIENT_SECRET:}
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_basic
            scope: service:authorization:snapshot
          native-tenant-two:
            provider: native-tenant-two
            client-id: ${NATIVE_SERVICE_CLIENT_ID:}
            client-secret: ${NATIVE_SERVICE_CLIENT_SECRET:}
            authorization-grant-type: client_credentials
            client-authentication-method: client_secret_basic
            scope: service:authorization:snapshot
        provider:
          native-control:
            token-uri: ${NATIVE_CONTROL_TOKEN_URI:}
          native-tenant-one:
            token-uri: ${NATIVE_TENANT_ONE_TOKEN_URI:}
          native-tenant-two:
            token-uri: ${NATIVE_TENANT_TWO_TOKEN_URI:}
  data:
    redis:
      cluster:
        nodes: []
      host: ${REDIS_TEST_HOST:127.0.0.1}
      port: ${REDIS_TEST_PORT:6379}
      username: ${REDIS_TEST_USERNAME:}
      password: ${REDIS_TEST_PASSWORD:}
      ssl:
        enabled: false
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV4
      - org.springframework.boot.data.redis.autoconfigure.DataRedisAutoConfiguration
      - org.springframework.boot.security.oauth2.client.autoconfigure.OAuth2ClientAutoConfiguration
management:
  health:
    rabbit:
      enabled: false
    redis:
      enabled: false


app:
  integrations:
    rabbitmq:
      enabled: false
    redis:
      enabled: false
    external-http:
      enabled: false

egon:
  cola:
    component:
      cache:
        enabled: false
        node-id: ""
        key-prefix: egon:cola:cache:v2:${spring.application.name}
        tenant-mdc-key: tenantId
        second-evict-delay: PT5S
        redis:
          topic: "egon:cola:cache:event"
        l1:
          max-size: 10000
        ttl:
          l1-expire: PT5M
          l1-jitter: PT2M
          l2-expire: PT1H
          l2-jitter: PT20M
          null-expire: PT60S
        batch:
          max-keys: 1000
        lock:
          wait-time: PT0.5S
          lease-time: PT10S
      mybatis-plus:
        enabled: true
        tenant-id:
          mdc-key: tenantId
          ignored-tables: []
        audit:
          user-id-mdc-key: userId
        pagination:
          enabled: true
          max-page-size: 500
          overflow: false
        batch:
          default-size: 1000
          max-chunk-size: 1000
          max-collection-size: 10000
        block-attack:
          enabled: true
        optimistic-locker:
          enabled: true
        dynamic-table-name:
          enabled: false
          tables: {}
        illegal-sql:
          enabled: false
        ddl:
          enabled: true
          lock-timeout: PT30S
          statement-timeout: PT300S
          topology-ready-timeout: PT60S
        local-write-guard:
          enabled: true
          allowed-root-statements: {}
        sharding:
          enabled: true
          mode: SHARDING
          config-style: STRATEGY
          transaction-default-type: LOCAL
          data-sources:
            - name: master_data
              logical-name: master_data
              role: PRIMARY
              driver-class-name: org.postgresql.Driver
              jdbc-url: jdbc:postgresql://localhost:5432/light_test_master_data
              username: test
              password: test
            - name: shard_0
              logical-name: shard_0
              role: PRIMARY
              driver-class-name: org.postgresql.Driver
              jdbc-url: jdbc:postgresql://localhost:5432/light_test_shard_0
              username: test
              password: test
            - name: shard_1
              logical-name: shard_1
              role: PRIMARY
              driver-class-name: org.postgresql.Driver
              jdbc-url: jdbc:postgresql://localhost:5432/light_test_shard_1
              username: test
              password: test
          tables:
            users:
              type: SINGLE
              data-source: master_data
            roles:
              type: SINGLE
              data-source: master_data
            permissions:
              type: SINGLE
              data-source: master_data
            user_roles:
              type: SINGLE
              data-source: master_data
            role_permissions:
              type: SINGLE
              data-source: master_data
            courses:
              type: SINGLE
              data-source: master_data
            school_classes:
              type: STANDARD_TENANT_ID
              sharding-column: tenant_id
            class_course_schedules:
              type: STANDARD_TENANT_ID
              sharding-column: tenant_id
      id:
        enabled: true
        machine-id: 0
        max-clock-backward: PT0.005S
        redis:
          enabled: false
          env: test
          app: fixture
          lease-duration: 5m
          renew-interval: 1m
      rpc:
        enabled: false
        transport: h2c
        identity:
          env: ${APP_ENV:test}
          host: ${POD_IP:${HOSTNAME:local}}
          instance-id: ${POD_UID:${HOSTNAME:local}}
        provider:
          enabled: false
          bind-address: ${RPC_BIND_ADDRESS:0.0.0.0}
          port: ${RPC_PORT:50051}
        consumer:
          enabled: false
          default-timeout-ms: 3000
          bindings: {}
      tianshu:
        tenant-id: ${TIANSHU_TENANT_ID:}
        enabled: false
        baseline:
          file: ${TIANSHU_CONFIG_BASELINE_FILE:/var/run/tianshu/config/baseline.json}
          scope:
            tenant-id: ${TIANSHU_TENANT_ID:}
            biz-code: ${TIANSHU_BIZ_CODE:student-management}
            env: ${APP_ENV:test}
            app-code: ${TIANSHU_APP_CODE:${spring.application.name}}
            resource-name: application.yml
          target:
            binding-id: ${TIANSHU_CONFIG_TARGET_BINDING_ID:}
            binding-revision: ${TIANSHU_CONFIG_TARGET_BINDING_REVISION:}
            cluster-id: ${CLUSTER_ID:}
            kubernetes-namespace: ${POD_NAMESPACE:}
            workload-uid: ${WORKLOAD_UID:}
            container-name: ${CONTAINER_NAME:application}
        delivery:
          enabled: false
          service-origin: ${TIANSHU_CONFIG_SERVICE_ORIGIN:http://tianshu-config.platform-system.svc.cluster.local}
          workload-token-file: ${TIANSHU_WORKLOAD_TOKEN_FILE:/var/run/tianshu/identity/workload-token}
          state-directory: ${TIANSHU_CONFIG_STATE_DIRECTORY:/var/run/tianshu/state}
          pod-uid: ${POD_UID:}
          registration-id: ${TIANSHU_CONFIG_REGISTRATION_ID:}
          app-id: ${TIANSHU_CONFIG_APP_ID:}
          identity-tenant-id: ${TIANSHU_CONFIG_IDENTITY_TENANT_ID:}
          expected-issuer: ${TIANSHU_CONFIG_ISSUER:}
          canonical-audience: ${TIANSHU_CONFIG_RESOURCE_URI:}
          request-timeout: ${TIANSHU_CONFIG_REQUEST_TIMEOUT:15s}
          poll-interval: ${TIANSHU_CONFIG_POLL_INTERVAL:30s}
          max-stale: ${TIANSHU_CONFIG_MAX_STALE:5m}
          allow-offline-start: false
          baseline-valid-until: ${TIANSHU_CONFIG_BASELINE_VALID_UNTIL:}
      yuheng:
        openapi:
          enabled: false
    platform:
      tianquan:
        shoubing:
          enabled: false
          register-filter: false
          issuer: ${TIANQUAN_SHOUBING_ISSUER:}
          jwk-set-uri: ${TIANQUAN_SHOUBING_JWK_SET_URI:}
          resource-server-id: ${TIANQUAN_SHOUBING_RESOURCE_SERVER_ID:}
          resource-uri: ${TIANQUAN_SHOUBING_RESOURCE_URI:}
          clock-skew: PT30S
          trusted-issuers:
            tenant-one:
              issuer: ${NATIVE_TENANT_ONE_ISSUER:}
              jwks-uri: ${NATIVE_TENANT_ONE_JWKS_URI:}
              realm-key: ${NATIVE_TENANT_ONE_REALM_KEY:}
              realm-type: TENANT
              tenant-id: ${NATIVE_TENANT_ONE_ID:}
              status: ACTIVE
              trust-version: ${NATIVE_TENANT_ONE_TRUST_VERSION:1}
            tenant-two:
              issuer: ${NATIVE_TENANT_TWO_ISSUER:}
              jwks-uri: ${NATIVE_TENANT_TWO_JWKS_URI:}
              realm-key: ${NATIVE_TENANT_TWO_REALM_KEY:}
              realm-type: TENANT
              tenant-id: ${NATIVE_TENANT_TWO_ID:}
              status: ACTIVE
              trust-version: ${NATIVE_TENANT_TWO_TRUST_VERSION:1}
          revocation:
            mode: STRICT_SHARED
            primary-endpoint: ${OAUTH_REVOCATION_PRIMARY_ENDPOINT:}
            timeout: PT0.5S
            epoch: ${OAUTH_REVOCATION_EPOCH:}
          jwks-cache:
            ttl: PT300S
            max-issuers: 1000
            connect-timeout: PT2S
            read-timeout: PT5S
          usage-observation:
            enabled: false
            receiver: APPLICATION
            fallback-issuer: ${TIANQUAN_SHOUBING_ISSUER:}
            allow-local-plaintext: false
          audit:
            stream: egon:oauth:audit:v1
            spool-directory: ${NATIVE_OAUTH_AUDIT_SPOOL_DIRECTORY:}
            spool-max-bytes: 1073741824
            hmac-key-file: ${NATIVE_OAUTH_AUDIT_HMAC_KEY_FILE:}
            replay-initial-delay: 5000
            replay-delay: 5000
            delivery:
              receipt-ttl: PT1H
              confirmation-timeout: PT30S
              batch-size: 100
          service-client:
            app-id: stellar-enclosure-source-light
            registration-id: tianshuregistration
            credential-versions:
              tianshuregistration: ${NATIVE_CONTROL_CREDENTIAL_VERSION:1}
              native-tenant-one: ${NATIVE_TENANT_ONE_CREDENTIAL_VERSION:1}
              native-tenant-two: ${NATIVE_TENANT_TWO_CREDENTIAL_VERSION:1}
            # Deployment manifest supplies exact positive tenant IDs; there is no default tenant selection.
            tenant-registration-ids: {}
            renewal-skew: PT60S
          rpc:
            enabled: false
            consumer:
              enabled: false
              bindings: {}
            provider:
              enabled: false
              methods:
                "[top.egon.cola.archetype.source.light.facade.rpc.v1.CourseService/CreateCourse]":
                  required: true
                  principal-kind: SERVICE
                  scope-context: TENANT
                  expected-resource-uri: ${TIANQUAN_SHOUBING_RESOURCE_URI:}
                  required-scopes: ["stellar-enclosure-source-light:course:create"]
                "[top.egon.cola.archetype.source.light.facade.rpc.v1.CourseService/GetCourse]":
                  required: true
                  principal-kind: SERVICE
                  scope-context: TENANT
                  expected-resource-uri: ${TIANQUAN_SHOUBING_RESOURCE_URI:}
                  required-scopes: ["stellar-enclosure-source-light:course:read"]
                "[top.egon.cola.archetype.source.light.facade.rpc.v1.PermissionService/GetUserPermissions]":
                  required: true
                  principal-kind: SERVICE
                  scope-context: TENANT
                  expected-resource-uri: ${TIANQUAN_SHOUBING_RESOURCE_URI:}
                  required-scopes: ["stellar-enclosure-source-light:permission:read"]
                "[top.egon.cola.archetype.source.light.facade.rpc.v1.PermissionService/GrantPermission]":
                  required: true
                  principal-kind: SERVICE
                  scope-context: TENANT
                  expected-resource-uri: ${TIANQUAN_SHOUBING_RESOURCE_URI:}
                  required-scopes: ["stellar-enclosure-source-light:permission:grant"]
                "[top.egon.cola.archetype.source.light.facade.rpc.v1.SchoolClassService/CreateSchoolClass]":
                  required: true
                  principal-kind: SERVICE
                  scope-context: TENANT
                  expected-resource-uri: ${TIANQUAN_SHOUBING_RESOURCE_URI:}
                  required-scopes: ["stellar-enclosure-source-light:school-class:create"]
                "[top.egon.cola.archetype.source.light.facade.rpc.v1.SchoolClassService/GetSchoolClass]":
                  required: true
                  principal-kind: SERVICE
                  scope-context: TENANT
                  expected-resource-uri: ${TIANQUAN_SHOUBING_RESOURCE_URI:}
                  required-scopes: ["stellar-enclosure-source-light:school-class:read"]
                "[top.egon.cola.archetype.source.light.facade.rpc.v1.SchoolClassService/ScheduleCourse]":
                  required: true
                  principal-kind: SERVICE
                  scope-context: TENANT
                  expected-resource-uri: ${TIANQUAN_SHOUBING_RESOURCE_URI:}
                  required-scopes: ["stellar-enclosure-source-light:school-class:schedule-course"]
                "[top.egon.cola.archetype.source.light.facade.rpc.v1.UserService/AssignRole]":
                  required: true
                  principal-kind: SERVICE
                  scope-context: TENANT
                  expected-resource-uri: ${TIANQUAN_SHOUBING_RESOURCE_URI:}
                  required-scopes: ["stellar-enclosure-source-light:role:assign"]
                "[top.egon.cola.archetype.source.light.facade.rpc.v1.UserService/CreateUser]":
                  required: true
                  principal-kind: SERVICE
                  scope-context: TENANT
                  expected-resource-uri: ${TIANQUAN_SHOUBING_RESOURCE_URI:}
                  required-scopes: ["stellar-enclosure-source-light:user:create"]
                "[top.egon.cola.archetype.source.light.facade.rpc.v1.UserService/GetUser]":
                  required: true
                  principal-kind: SERVICE
                  scope-context: TENANT
                  expected-resource-uri: ${TIANQUAN_SHOUBING_RESOURCE_URI:}
                  required-scopes: ["stellar-enclosure-source-light:user:read"]
        jianshen:
          enabled: false
          register-filter: false
          system-code: stellar-enclosure-source-light
          user-scope-policy:
            enabled: false
            permission-scopes:
              "[stellar-enclosure-source-light:course:create]": ["stellar-enclosure-source-light:course:create"]
              "[stellar-enclosure-source-light:course:read]": ["stellar-enclosure-source-light:course:read"]
              "[stellar-enclosure-source-light:permission:grant]": ["stellar-enclosure-source-light:permission:grant"]
              "[stellar-enclosure-source-light:permission:read]": ["stellar-enclosure-source-light:permission:read"]
              "[stellar-enclosure-source-light:role:assign]": ["stellar-enclosure-source-light:role:assign"]
              "[stellar-enclosure-source-light:school-class:create]": ["stellar-enclosure-source-light:school-class:create"]
              "[stellar-enclosure-source-light:school-class:read]": ["stellar-enclosure-source-light:school-class:read"]
              "[stellar-enclosure-source-light:school-class:schedule-course]": ["stellar-enclosure-source-light:school-class:schedule-course"]
              "[stellar-enclosure-source-light:user:create]": ["stellar-enclosure-source-light:user:create"]
              "[stellar-enclosure-source-light:user:read]": ["stellar-enclosure-source-light:user:read"]
          authorization:
            endpoint: ${TIANQUAN_JIANSHEN_AUTHORIZATION_ENDPOINT:}
            cache-ttl: PT5M
            maximum-jitter: PT30S
            near-cache-ttl: PT5S
            fetch-timeout: PT1S
            service-token:
              enabled: false
              resource-uri: ${TIANQUAN_JIANSHEN_RESOURCE_URI:}
              scopes: service:authorization:snapshot
              renewal-skew: PT60S
          runtime:
            redis-enabled: false
            redis-address: ${RBAC3_RUNTIME_REDIS_ADDRESS:}
            database: ${RBAC3_RUNTIME_REDIS_DATABASE:0}
            password-file: ${RBAC3_RUNTIME_REDIS_PASSWORD_FILE:}
            timeout: PT2S

logging:
  level:

server:
  ssl:
    enabled: false
